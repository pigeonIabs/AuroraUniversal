<!doctype html>
<html lang="en" class="cgpt-ambient-on cgpt-appearance-clear">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aurora launch studio</title>
  <link rel="stylesheet" href="../../shared.css">
  <link rel="stylesheet" href="../../theme-background.css">
  <style>
    @font-face {font-family:Inter;src:url('../../assets/fonts/inter-6.woff2') format('woff2');font-style:normal;font-weight:100 900;font-display:block}
    html,body {margin:0;width:100%;height:100%;overflow:hidden;background:transparent;--theme-bg-color:#09090c;--bg-filter:none;--bg-opacity:1;--haze-gradient:transparent;--overlay-gradient:transparent}
    #wordmark {position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:Inter,Arial,sans-serif;text-align:center}
    #wordmark .aurora {font-size:18vw;line-height:1.05;font-weight:620;letter-spacing:-.065em;margin-left:-.065em}
    #wordmark .universal {font-size:3.2vw;line-height:1.2;font-weight:480;letter-spacing:.35em;margin-top:2vw;margin-right:-.35em}
    html.title #wordmark {display:flex}
    html.title #cgpt-ambient-bg {filter:brightness(.6)}
  </style>
</head>
<body>
  <div id="wordmark"><div class="aurora">Aurora</div><div class="universal">UNIVERSAL</div></div>
  <script>
    const params = new URLSearchParams(location.search);
    const theme = params.get('theme') || 'space';
    const themes = {space:'__space__',gradient:'__gpt5_animated__',black:'__pure_black__',horizon:new URL('../../assets/grok-4.webp',location.href).href,default:'',ocean:'__deep_ocean__',northern:'__northern_lights__',dawn:'__dawn__',ember:'__ember__'};
    const settings = {customBgUrl:themes[theme] ?? themes.space,backgroundBlur:'0',backgroundScaling:'cover'};
    window.chrome = {runtime:{getURL:path=>new URL('../../'+path,location.href).href}};
    window.AuroraExt = {config:{ID:'cgpt-ambient-bg'},startupTimings:{},getSettings:()=>settings,isEnabled:()=>true,utils:{setStyle:(node,key,value)=>node.style.setProperty(key,value)}};
    if(params.has('title'))document.documentElement.classList.add('title');
  </script>
  <script src="../../modules/aurora/preferences.js"></script>
  <script src="../../modules/aurora/background.js"></script>
  <script>
    AuroraExt.background.show();
    window.sceneReady = async()=>{
      await document.fonts.ready;
      while(AuroraExt.background.manager.state==='loading')await new Promise(resolve=>setTimeout(resolve,20));
      await Promise.all([...document.images].map(image=>image.decode().catch(()=>{})));
      return true;
    };
    window.setSceneTime = (seconds,rate=1)=>{
      for(const animation of document.getAnimations()){
        animation.pause();
        const speed=animation.animationName==='aurora-sidereal-drift'?rate:1;
        animation.currentTime=(seconds*speed+40)*1000;
      }
    };
  </script>
</body>
</html>
